[project]
name = "training"
version = "0.1.0"
description = "Horizon ML training, certification, and inference pipeline"
readme = "README.md"
authors = [{ name = "Samir Hassen", email = "fake@email.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "lightgbm>=4.6.0",
  "mlflow>=3.12.0",
  "polars>=1.40.1",
  "psycopg2-binary>=2.9.12",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.8.0",
]

[project.scripts]
horizon-train = "training.train:main"
horizon-certify = "training.certify:main"
horizon-predict = "training.predict:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
