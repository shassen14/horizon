[workspace]
members = [
  "crates/horizon-db",
  "crates/horizon-ingest",
  "crates/horizon-quality",
  "crates/horizon-features",
  "crates/horizon-api",
  "crates/horizon-scheduler",
]
resolver = "2"


[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio",
  "macros",
  "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
axum = "0.8"
toml = "1"
ta = "0.5"
rayon = "1.12"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1.0"
thiserror = "2.0"
